<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- This file used to BE the calculator. On 2026-09-12 the calculator became
     `index.html` — the page `/lottery/` serves — and the two-card launcher that
     stood there was retired: with only two tools, each already linking the other
     from its own footer, the chooser was a click asking which of two doors you
     wanted before showing you either.

     What is left here is a redirect, and it exists because THIS address is the one
     that was public. It is in the README, in the manifest's shortcuts, in whatever
     anyone bookmarked — and, most importantly, inside every share link ever copied
     out of the calculator: `shareURL()` builds them from `location.pathname`, so a
     link mailed before today reads
     `/lottery/ny-lottery-calculator.html#s=<figures>`. Delete this file and those
     links stop opening.

     The FRAGMENT is why this is a script rather than a bare `<meta refresh>`: a
     refresh carries the path and nothing else, so a share link would land on the
     calculator with the shared figures silently dropped — the worst kind of
     failure, since the page would look like it worked. `location.replace` also
     keeps the stub out of the back button, which a refresh does not.

     A CSP on a redirect stub is not ceremony: every page on this origin shares one
     browser jar with the apps that hold work data, so a page here with no policy is
     a hole in all of them. This one allows nothing at all beyond its own inline
     script — no network, no images, no styles, no forms. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>NY Lottery After-Tax Calculator</title>
<link rel="canonical" href="https://eagleadams86.github.io/lottery/">
<script>
  /* `search` and `hash` both, in that order — the calculator reads its share
     links out of the fragment today, and a query string costs nothing to carry
     and would be missed if one is ever added. `replace`, not `assign`: the back
     button should return where the reader came from, not bounce off this file. */
  location.replace('./' + location.search + location.hash);
</script>
<!-- The no-script path. It loses the fragment, for the reason above, so the
     figures in a shared link are gone by the time it lands — but a reader with
     script turned off has no working calculator either way, and arriving at the
     page beats staring at this one. -->
<noscript><meta http-equiv="refresh" content="0; url=./"></noscript>
</head>
<body>
<noscript><p>The calculator has moved. <a href="./">Open it here</a>.</p></noscript>
</body>
</html>
