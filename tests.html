<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<!-- Every page on the shared origin ships a CSP (the family security rule) —
     this one is published on GitHub Pages beside the pages it tests, so it is
     as much a page on the origin as they are. connect-src 'self' is for reading
     sw.js and the pages as text (the offline group below pins their shape),
     api.github.com for the CI-scorecard line, and frame-src 'self' for the two
     harness iframes, whose content is then governed by each page's own CSP.
     `style-src 'self'` is what lets theme.css load, so this page wears the same
     palette as the pages it tests. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self' https://api.github.com; frame-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lottery — Tests</title>
<style>
  /* Dev-only page: pins the pure functions in BOTH apps — the calculator's
     input/API boundaries (parseField, ball, fmtDrawDate, the block builders)
     and tax arithmetic (taxBreakdown), and the portfolio's income model
     (computeIncome, parseLatest1yr) and input boundary (syncSlider). Loads
     each real page in a hidden same-origin iframe and calls its functions
     directly, so what's tested is what ships. Serve over http://localhost
     (python3 -m http.server 8010); file:// iframes are blocked in some
     browsers. The apps' own boot code runs (theme write, jackpot/winning
     fetches that fail harmlessly off the live origin) — the pure-function
     tests add no writes of their own; only the syncSlider group drives a
     real handler whose render() saves slider state, into the localhost
     copy's storage the localhost gate already confines it to. Colours are
     the Midnight palette from the theme pack (dev page, hardcoded). */
  body { background: #0a0e1a; color: #e7eaf6; margin: 0;
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #838cab; font-size: 12.5px; margin: 0 0 18px; }
  #summary { font-weight: 600; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px;
             border: 1px solid #262f4a; background: #121829; }
  #summary.ok  { color: #72fe84; border-color: #72fe84; }
  #summary.bad { color: #fb7874; border-color: #fb7874; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 8px; border-bottom: 1px solid #262f4a; vertical-align: top; }
  td.st { width: 28px; font-weight: 700; }
  tr.pass td.st { color: #72fe84; }
  tr.fail td.st { color: #fb7874; }
  tr.fail td.msg { color: #fb7874; }
  .msg { color: #838cab; font-size: 12px; white-space: pre-wrap; }
  .group td { padding-top: 16px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
              text-transform: uppercase; color: #838cab; border-bottom-color: #374163; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Lottery — Pure-Function Tests</h1>
  <p class="sub">Runs against the real <code>ny-lottery-calculator.html</code> and <code>lottery-portfolio.html</code> in hidden iframes.</p>
  <div id="summary">Loading apps…</div>
  <table><tbody id="out"></tbody></table>
</div>
<!-- The two frames are built in script, not here: they boot the real pages, so
     they must not exist until the localhost gate at the foot of this file has
     passed. -->

<script>
'use strict';
const TESTS = [];
function group(name) { TESTS.push({ group: name }); }
function t(name, fn) { TESTS.push({ name, fn }); }
function eq(actual, expected, note) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a !== e) throw new Error((note ? note + ': ' : '') + 'expected ' + e + ', got ' + a);
}
/* `detail` is the value that FAILED, not more prose — the same signature Sprint
   Predictability's suite grew on 2026-08-26, and for the same reason: call sites
   here were passing a third argument to a two-argument `ok` and it was being
   dropped on the floor, so an assertion could report what it expected and never
   what it saw. CodeQL's js/superfluous-trailing-arguments is what noticed, both
   times. */
function ok(cond, note, detail) {
  if (cond) return;
  throw new Error((note || 'expected truthy')
    + (detail === undefined ? '' : ' \u2014 got ' + detail));
}
/* ── The completeness floor ─────────────────────────────────────────────────
   "Everything that ran passed" is only half an answer. Nothing above counts the
   tests, so a group deleted by accident — or a `PAGES.forEach` that ends up
   iterating nothing — takes its tests out of the suite silently, and the page
   and CI both go on reporting green over whatever is left. CI checks the words
   `All N tests pass` and has never cared what N is.

   This is what makes the count itself an assertion. It is the number the suite
   registers today, so ADDING a test never fails the build; removing one does,
   which is the moment to ask whether it should have gone. Lower it deliberately
   when a test is deliberately retired. */
const EXPECTED = 160;
/* HTML comments explain things by naming them — including the very elements
   these assertions look for, and one of those notes lives in a <style> block a
   strip does not reach. So the comments come out before the page is matched
   against, or the prose passes the test it is describing.

   Looped until the string stops changing, rather than a single .replace(). One
   pass over a multi-character delimiter can leave a NEW opener behind that the
   pass already went past — `<` `!--` `<` `!--` `--` `>` collapses to a live
   `<` `!--` on the way out — so a single pass is only as good as the input is
   well-formed. CodeQL's js/incomplete-multi-character-sanitization flagged
   exactly this. The stakes are low (this reads local repo files to assert on
   them, it does not sanitize anything a browser will render) but a test that
   can be fooled about what is commented out is a test that can miss a live
   off-origin script, so it is worth doing properly. Same helper, same wording,
   in every sibling repo’s suite. */
const stripHtmlComments = (s) => {
  let out = String(s), prev;
  do { prev = out; out = out.replace(/<!--[\s\S]*?-->/g, ''); } while (out !== prev);
  return out;
};

/* Money figures come out of float multiplication, so exact eq() would pin
   rounding noise instead of the model. Within a dollar is equality here. */
function near(actual, expected, note) {
  if (Math.abs(actual - expected) > 1)
    throw new Error((note ? note + ': ' : '') + 'expected ~' + expected + ', got ' + actual);
}
let wc, wp; // the two app iframes' windows

/* Set an input's value directly — no events fired, so the app's handlers
   (and calc()'s localStorage write) never run. */
function setBox(win, id, v) { win.document.getElementById(id).value = v; }

group('parseField — the manual-amount boundary (calculator)');
t('a bare number takes the active unit', () => {
  setBox(wc, 'jackpot-input', '238');
  eq(wc.parseField('jackpot-input', 'M'), 238e6);
  eq(wc.parseField('jackpot-input', 'B'), 238e9);
});
t('a typed M/B suffix overrides the unit toggle, either case', () => {
  setBox(wc, 'jackpot-input', '1.5B');
  eq(wc.parseField('jackpot-input', 'M'), 1.5e9);
  setBox(wc, 'jackpot-input', '106m');
  eq(wc.parseField('jackpot-input', 'B'), 106e6);
});
t('dollar signs, commas and spaces are stripped first', () => {
  setBox(wc, 'jackpot-input', '$1,000 ');
  eq(wc.parseField('jackpot-input', 'M'), 1000e6);
});
t('malformed numbers are rejected outright, not partially parsed', () => {
  setBox(wc, 'jackpot-input', '1.2.3');
  eq(wc.parseField('jackpot-input', 'M'), null, '"1.2.3" must not quietly read as 1.2');
  setBox(wc, 'jackpot-input', 'abc');
  eq(wc.parseField('jackpot-input', 'M'), null);
});
t('an empty box is null (meaning: estimate the lump at 60%)', () => {
  setBox(wc, 'jackpot-input', '');
  eq(wc.parseField('jackpot-input', 'M'), null);
});

group('ball / fmtDrawDate / block builders — the API-data allowlist');
t('ball() renders only one or two digits; anything else is nothing', () => {
  ok(wc.ball('7').includes('>7<'), 'a plain number renders');
  eq(wc.ball('123'), '', 'three digits rejected');
  eq(wc.ball('<img src=x onerror=alert(1)>'), '', 'markup rejected');
  eq(wc.ball(null), '');
  eq(wc.ball(' 12 ').includes('>12<'), true, 'whitespace is trimmed first');
});
t('fmtDrawDate() only accepts YYYY-MM-DD-shaped input', () => {
  ok(wc.fmtDrawDate('2026-08-07').includes('Aug 7, 2026'));
  eq(wc.fmtDrawDate('javascript:alert(1)'), '');
  eq(wc.fmtDrawDate(''), '');
});
t('a hostile API payload renders as empty chrome, never as markup', () => {
  const r = { winning_numbers: '<script>alert(1)<\/script>', mega_ball: '"><img src=x>',
              multiplier: '<b>', draw_date: '<svg onload=x>' };
  const out = wc.pbBlock(r) + wc.mmBlock(r);
  ok(!/onerror|onload|<script|<img|<svg/.test(out), 'no hostile markup survives: ' + out);
});
t('a real Powerball result renders six balls and the multiplier', () => {
  const out = wc.pbBlock({ winning_numbers: '5 12 23 34 45 6', multiplier: '3', draw_date: '2026-08-05' });
  eq((out.match(/class="ball/g) || []).length, 6);
  ok(out.includes('Power Play'), 'multiplier shown');
  ok(out.includes('Aug 5, 2026'), 'draw date shown');
});
t('a real Mega Millions result renders five whites plus the mega ball', () => {
  const out = wc.mmBlock({ winning_numbers: '5 12 23 34 45', mega_ball: '7', draw_date: '2026-08-04' });
  eq((out.match(/class="ball/g) || []).length, 6);
});
t('all six games are known, each with its own dataset', () => {
  const ids = Object.keys(wc.WN_GAMES);
  eq(ids.sort(), ['lotto', 'mfl', 'mm', 'pb', 'pick10', 'take5']);
  const sets = ids.map((g) => wc.WN_GAMES[g].set);
  eq(sets.length, new Set(sets).size, 'two games must not share a dataset id');
  for (const g of ids) {
    ok(/^[a-z0-9]{4}-[a-z0-9]{4}$/.test(wc.WN_GAMES[g].set), g + ' has a malformed dataset id');
    ok(wc.wnURL(g).startsWith('https://data.ny.gov/resource/'), g + ' must stay on the one feed');
  }
  /* Cash 4 Life is a RETIRED game whose dataset is still served. Adding it back
     would pin "the latest results" to a draw from February for ever. */
  ok(!sets.includes('kwxv-fwze'), 'that dataset is the retired Cash 4 Life');
});
t('a game id that is a property of every object is not a game', () => {
  /* `WN_GAMES['constructor']` is truthy on any plain object, so a bare lookup
     would have let a share link or a stale preference through to a fetch of
     `undefined.json`. */
  for (const junk of ['constructor', '__proto__', 'toString', 'nope', '', null, 7])
    eq(wc.knownGame(junk), false, 'knownGame let ' + String(junk) + ' through');
  for (const g of Object.keys(wc.WN_GAMES)) eq(wc.knownGame(g), true);
});
t('every game block refuses hostile data, not just the two original ones', () => {
  const r = { winning_numbers: '<script>alert(1)<\/script>', mega_ball: '"><img src=x>',
              bonus: '<b>', mill_ball: 'javascript:', multiplier: '<b>',
              midday_winning_numbers: '<svg onload=x>', evening_winning_numbers: '"><img src=y>',
              draw_date: '<svg onload=x>' };
  for (const g of Object.keys(wc.WN_GAMES)) {
    const out = wc.gameBlock(g, r);
    ok(!/onerror|onload|<script|<img|<svg|javascript:/.test(out),
      g + ' let hostile markup through: ' + out);
  }
});
t('the four newer games render the ball counts their feeds actually return', () => {
  eq((wc.gameBlock('lotto', { winning_numbers: '16 18 19 22 29 52', bonus: '43',
      draw_date: '2026-08-19' }).match(/class="ball/g) || []).length, 7, 'six plus a bonus ball');
  const t5 = wc.gameBlock('take5', { midday_winning_numbers: '15 23 27 32 37',
      evening_winning_numbers: '02 26 27 33 35', draw_date: '2026-08-21' });
  eq((t5.match(/class="ball/g) || []).length, 10, 'two draws a day, five each');
  ok(t5.includes('Midday') && t5.includes('Evening'), 'both draws must be labelled');
  const p10 = wc.gameBlock('pick10', { winning_numbers:
      '09 17 19 22 34 37 40 42 45 49 51 56 57 64 65 67 69 70 78 79', draw_date: '2026-08-21' });
  eq((p10.match(/class="ball/g) || []).length, 20);
  ok(p10.includes('wn-balls many'), 'twenty balls must wrap, or they overflow the card');
  eq((wc.gameBlock('mfl', { winning_numbers: '01 20 25 56 57', mill_ball: '2',
      draw_date: '2026-08-21' }).match(/class="ball/g) || []).length, 6);
});

group('share links — the least trusted input the page has');
t('a link round-trips every figure it carries', () => {
  const url = wc.shareURL();
  ok(url.includes('#s='), 'the payload rides in the fragment, never a query string');
  const p = wc.readShare(url.slice(url.indexOf('#')));
  ok(p, 'the page could not read back its own link');
  eq(p.f, wc.filingStatus(p.f)); eq(p.r, wc.residence(p.r));
  ok(wc.PAYOUTS.includes(p.p));
});
t('anything that is not one of ours is refused rather than guessed at', () => {
  eq(wc.readShare(''), null);
  eq(wc.readShare('#other=1'), null, 'a fragment we did not write is not ours');
  eq(wc.readShare('#s=not-base64!!!'), null);
  eq(wc.readShare('#s=' + btoa('{"v":1')), null, 'truncated JSON');
  eq(wc.readShare('#s=' + btoa('{"v":99}')), null, 'a payload from a newer build');
});
t('a hand-edited link cannot put a value anywhere it does not belong', () => {
  const mk = (o) => '#s=' + btoa(JSON.stringify(o)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const p = wc.readShare(mk({ v: 1, g: '<img src=x>', w: 'constructor', p: 'evil',
                              f: '__proto__', r: 'mars', n: 1e9, d: 99,
                              j: '9e99', ju: 'Z', l: 'alert(1)', lu: {} }));
  eq(p.g, 'pb'); eq(p.w, null); eq(p.p, 'lump');
  eq(p.f, 'single'); eq(p.r, 'ny');
  eq(p.n, 1000, 'the winner count is clamped, not trusted');
  eq(p.d, 0.04, 'a 99 discount rate is not a rate');
  eq(p.j, '', 'an amount past the ceiling is dropped');
  eq(p.l, '', 'an unreadable amount is dropped');
  eq(p.ju, 'M'); eq(p.lu, 'M');
});
t('a negative or absurd amount never reaches the boxes', () => {
  const mk = (o) => '#s=' + btoa(JSON.stringify(o)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  eq(wc.readShare(mk({ v: 1, j: '-500', ju: 'M' })).j, '');
  eq(wc.readShare(mk({ v: 1, j: '999999', ju: 'B' })).j, '', 'past MAX_AMOUNT');
  eq(wc.readShare(mk({ v: 1, j: '500', ju: 'M' })).j, '500', 'a real one survives');
});

group('calculator formatters');
t('fmt() rounds to whole dollars with separators; null and NaN are an em dash', () => {
  eq(wc.fmt(1234567.4), '$1,234,567');
  eq(wc.fmt(null), '—');
  eq(wc.fmt(NaN), '—');
});
t('fmtM() trims trailing zeros; fmtM1() always keeps one decimal', () => {
  eq(wc.fmtM(1.5e9), '$1.5B');
  eq(wc.fmtM(2e9), '$2B');
  eq(wc.fmtM(238e6), '$238M');
  eq(wc.fmtM1(238e6), '$238.0M');
  eq(wc.fmtM1(1.5e9), '$1.5B');
});

group('winnersValue — the split-count clamp');
t('typed values outside 1–1000 are clamped, junk becomes 1', () => {
  setBox(wc, 'npeople', '5000'); eq(wc.winnersValue(), 1000);
  setBox(wc, 'npeople', '-3');   eq(wc.winnersValue(), 1);
  setBox(wc, 'npeople', 'abc');  eq(wc.winnersValue(), 1);
  setBox(wc, 'npeople', '7');    eq(wc.winnersValue(), 7);
  setBox(wc, 'npeople', '1');
});

group('nextDraw — schedule invariants (time-of-day dependent, so invariants only)');
t('a game drawn every day is always Tonight or Tomorrow', () => {
  ok(['Tonight', 'Tomorrow'].includes(wc.nextDraw([0, 1, 2, 3, 4, 5, 6])));
});
t('the real schedules always produce a label', () => {
  ok(wc.nextDraw([1, 3, 6]).length > 0, 'Powerball (Mon/Wed/Sat)');
  ok(wc.nextDraw([2, 5]).length > 0, 'Mega Millions (Tue/Fri)');
});

group('tax.js — the engine both pages share');
t('the withholding rules are the ones the footnote promises', () => {
  /* These two are FIXED BY LAW and are not brackets: 24% federal on any prize of
     $5,000 or more, and 10.9% to New York whatever you end up owing. They are
     the reason the page shows "withheld" and "settled at filing" separately. */
  eq(wc.FED_WH, 0.24);
  eq(wc.NY_WH, 0.109, 'NY withholds at its highest effective rate (20 NYCRR 171.11)');
  eq(wc.WH_FLOOR, 5000);
  eq(wc.TAX_YEAR, 2026, 'the brackets below are this year — bump both together');
});
t('the top of each table is the rate the old flat model used', () => {
  const fed = wc.FED_BRACKETS.single, ny = wc.NY_BRACKETS.single;
  eq(fed[fed.length - 1][1], 0.37);
  eq(fed[fed.length - 1][0], Infinity, 'the last band must be open-ended');
  eq(ny[ny.length - 1][1], 0.109);
  for (const st of ['single', 'mfj']) {
    const t2 = wc.FED_BRACKETS[st];
    for (let i = 1; i < t2.length; i++) {
      ok(t2[i][0] > t2[i - 1][0], st + ' federal thresholds must ascend');
      ok(t2[i][1] > t2[i - 1][1], st + ' federal rates must ascend');
    }
  }
});
t('bracketTax stacks the bands rather than applying one rate to everything', () => {
  const table = [[100, 0.10], [200, 0.20], [Infinity, 0.30]];
  eq(wc.bracketTax(0, table), 0);
  eq(wc.bracketTax(-5, table), 0, 'a prize under the deduction is not a negative tax');
  near(wc.bracketTax(50, table), 5);
  near(wc.bracketTax(150, table), 10 + 10);
  near(wc.bracketTax(300, table), 10 + 20 + 30);
});
t('a $500,000 prize is not taxed at a jackpot rate — the bug this replaced', () => {
  /* The page applied a flat 37% federal and 10.9% NY to any amount until
     2026-08-22, which overstated the tax on a small share by tens of thousands.
     Both figures below are the bracket answer, and the old model's 47.9% is the
     number this test exists to keep from coming back. */
  const r = wc.payoutYear(500e3, 'single', 'ny');
  ok(r.eff > 0.30 && r.eff < 0.38, 'effective rate should be around a third, got ' + r.eff);
  ok(r.eff < 0.479 - 0.05, 'must be well below the old flat 47.9%');
  ok(r.settle < 0, 'over-withheld at 10.9% state, so filing produces a refund');
});
t('a jackpot still lands on the top rates, so the top end did not move', () => {
  const r = wc.payoutYear(100e6, 'single', 'ny');
  near(r.ny, 100e6 * 0.109, "NY's recapture flattens a big prize to 10.9%");
  ok(Math.abs(r.eff - 0.479) < 0.002, 'still ~47.9% at $100M, got ' + r.eff);
  ok(r.settle > 0, 'a jackpot still owes more at filing');
});
t("New York's recapture is never cheaper than the plain bracket sum", () => {
  /* The recapture only ever ADDS. If this ever inverts, the page would be
     quoting a state bill lower than the tables alone produce. */
  for (const st of ['single', 'mfj'])
    for (const inc of [50e3, 107650, 150e3, 500e3, 3e6, 6e6, 24e6, 25.5e6, 80e6])
      ok(wc.nyTax(inc, st) >= wc.bracketTax(inc, wc.NY_BRACKETS[st]) - 1e-6,
        'recapture went backwards at ' + st + ' ' + inc);
});
t('the two city options are the only things that change with residence', () => {
  const base = wc.ordinaryTax(1e6, 'single', 'ny');
  const nyc = wc.ordinaryTax(1e6, 'single', 'nyc');
  const yonkers = wc.ordinaryTax(1e6, 'single', 'yonkers');
  eq(base.local, 0);
  near(base.fed, nyc.fed, 'the city tax must not disturb the federal figure');
  ok(nyc.city > 0 && nyc.yonkers === 0);
  near(yonkers.yonkers, base.ny * wc.YONKERS_SURCHARGE, 'Yonkers is a surcharge on state tax');
  ok(nyc.total > base.total && yonkers.total > base.total);
});
t('nothing is withheld below the $5,000 floor', () => {
  const small = wc.payoutYear(4000, 'single', 'ny');
  eq(small.whTotal, 0, 'under the floor the payer withholds nothing');
  ok(small.settle > 0, 'so the whole (small) bill is settled at filing');
  ok(wc.payoutYear(5000, 'single', 'ny').whTotal > 0, 'at the floor it starts');
});
t('a value that is not a filing status or a residence can never index a table', () => {
  /* Both arrive from stored preferences and from share links, so this is the
     boundary check the rest of the engine relies on. */
  for (const junk of ['__proto__', 'constructor', 'MFJ', '', null, undefined, 0, {}])
    eq(wc.filingStatus(junk), 'single', 'filingStatus fell through on ' + String(junk));
  for (const junk of ['__proto__', 'nowhere', null, undefined, 7])
    eq(wc.residence(junk), 'ny', 'residence fell through on ' + String(junk));
});

group('annuities — the payout the page could not model before');
t('a graduated jackpot pays 30 rising payments that add to the advertised figure', () => {
  const s = wc.annuitySchedule(500e6, 'graduated30');
  eq(s.length, 30);
  near(s.reduce((a, b) => a + b, 0), 500e6, 'the payments ARE the jackpot');
  for (let i = 1; i < s.length; i++) near(s[i] / s[i - 1], 1.05, 'each is 5% above the last');
  ok(s[0] < 500e6 / 30, 'the first payment is smaller than an equal share, not larger');
});
t('NY Lotto pays 26 equal payments instead', () => {
  const s = wc.annuitySchedule(10e6, 'equal26');
  eq(s.length, 26);
  near(s[0], 10e6 / 26);
  near(s[25], s[0], 'no growth in this plan');
});
t('an unknown plan falls back rather than returning nothing', () => {
  eq(wc.annuitySchedule(1e6, 'no-such-plan').length, 30);
  eq(wc.annuitySchedule(0, 'graduated30').length, 0, 'no jackpot, no schedule');
});
t('present value discounts every payment but the first', () => {
  const s = [100, 100, 100];
  near(wc.presentValue(s, 0), 300, 'at 0% it is just the sum');
  near(wc.presentValue(s, 0.10), 100 + 100 / 1.1 + 100 / 1.21);
  ok(wc.presentValue(s, 0.05) < 300, 'a positive rate must reduce it');
});
t('thirty tax returns beat one, which is the whole argument', () => {
  /* Each payment is its own year, so each one walks up the brackets from the
     bottom. The effective rate on the annuity must therefore be LOWER than on
     a lump sum of the same headline figure. */
  const a = wc.annuityBreakdown(500e6, 1, 'graduated30');
  const lump = wc.payoutYear(500e6, 'single', 'ny');
  ok(a.eff < lump.eff, 'annuity ' + a.eff + ' should be under lump ' + lump.eff);
  near(a.gross, 500e6);
  near(a.net, a.gross - a.tax, 'net and tax must account for every dollar');
});

group('taxBreakdown — the arithmetic behind calc() (calculator)');
t('one winner: withholding, liability and net all follow from the tables', () => {
  const b = wc.taxBreakdown(100e6, 1);
  near(b.share, 100e6);
  near(b.fedWH, 24e6); near(b.nyWH, 10.9e6);
  near(b.afterWH, 100e6 - 34.9e6, 'received after withholding');
  ok(b.fedX > 12.5e6 && b.fedX < 13e6, 'the federal gap, after the standard deduction');
  near(b.nyX, 0, 'NY withholds at the rate the recapture flattens a jackpot to');
  near(b.net, b.share - b.tax);

/* ── The two ball colours are the ONE palette divergence this repo has ─────────
   Powerball red and Mega Millions gold are the games' own brand colours, and
   they are product identity rather than palette: a Powerball is red the way a
   road sign is red. The theme pack records them in its Known divergences list
   (2026-08-23) on the condition that the numbers below are gated HERE, because
   a divergence recorded only in prose is a divergence nobody re-checks.

   The maths is the pack's own check_contrast.py, ported: sRGB luminance for the
   contrast ratios, Vienot-Brettel for the two dichromacies, CIE Lab for deltaE. */
group('the lottery balls — a divergence, measured');
const _srgb = (c) => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
const _ch = (h, i) => _srgb(parseInt(h.replace('#', '').substr(i, 2), 16));
const _rgb = (h) => [_ch(h, 0), _ch(h, 2), _ch(h, 4)];
const _lum = (h) => { const [r, g, b] = _rgb(h); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const cRatio = (a, b) => { const l = [_lum(a), _lum(b)].sort((x, y) => y - x);
                           return (l[0] + 0.05) / (l[1] + 0.05); };
const _enc = (c) => { c = Math.min(1, Math.max(0, c));
  c = c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
  return Math.round(c * 255); };
const _hex = (r, g, b) => '#' + [r, g, b].map(v => _enc(v).toString(16).padStart(2, '0')).join('');
function simulate(h, kind) {
  const [r, g, b] = _rgb(h);
  let L = 17.8824 * r + 43.5161 * g + 4.11935 * b;
  let M = 3.45565 * r + 27.1554 * g + 3.86714 * b;
  const S = 0.0299566 * r + 0.184309 * g + 1.46709 * b;
  if (kind === 'deuter') M = 0.494207 * L + 1.24827 * S;
  else L = 2.02344 * M - 2.52581 * S;
  return _hex(0.0809444479 * L - 0.130504409 * M + 0.116721066 * S,
              -0.0102485335 * L + 0.0540193266 * M - 0.113614708 * S,
              -0.000365296938 * L - 0.00412161469 * M + 0.693511405 * S);
}
function lab(h) {
  const [r, g, b] = _rgb(h);
  const X = (0.4124 * r + 0.3576 * g + 0.1805 * b) / 0.95047;
  const Y = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  const Z = (0.0193 * r + 0.1192 * g + 0.9505 * b) / 1.08883;
  const f = (t) => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
  const [fx, fy, fz] = [f(X), f(Y), f(Z)];
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
}
const deltaE = (a, b) => Math.hypot(...lab(a).map((v, i) => v - lab(b)[i]));
const PB = '#b91c1c', MB = '#d4a017';
t('the two balls are still the two brand colours the divergence names', () => {

t('the two balls stay apart under BOTH dichromacies, at the pack\u2019s own bar', () => {
  /* The pack gates --series-1..5 pairwise at deltaE 18. These are not pack

/* ══════════════════════════════════════════════════════════════════════════
   The live T-bill note must not move the page when it arrives.

   `#tb-src` is EMPTY until the Treasury fetch returns — one to three seconds
   after load — and then applyTbill() writes "live · Aug 26" into it. It sits
   inline in a `width: 145px; flex-shrink: 0` label that already holds "T-bill
   yield", so it had nowhere to go: the label wrapped to two lines, the row grew
   19.5px, and every section below it — the waterfall, the projection, the whole
   lower half — jumped down the page while somebody was reading it. It broke
   mid-phrase too, leaving "26" alone on the second line.

   Nothing about that is visible in a screenshot taken before the fetch lands,
   and nothing about it is visible in one taken after. Only the two together
   say it, which is why this measures BOTH states rather than looking at either.
   Found 2026-08-26 while chasing something else entirely: a button appeared to
   move when it took focus, and it turned out the page had simply grown under it
   at that moment. */
group('The live rate note arrives without moving the page');
t('filling #tb-src changes nothing about the layout', () => {
  const d = wp.document;
  const src = d.getElementById('tb-src');
  ok(src, 'the rate-source note is on the page at all');
  const label = d.getElementById('sl-tb').closest('.sl-row').querySelector('label');
  const was = src.textContent;
  const measure = () => ({
    doc: d.documentElement.scrollHeight,
    label: Math.round(label.getBoundingClientRect().height * 10) / 10,
  });
  try {
    src.textContent = '';

    /* The exact string applyTbill() writes, longest realistic month included. */
    src.textContent = 'live \u00b7 Sept 26';
    const filled = measure();
    eq(filled.label, empty.label,
      'the label is the same height before and after the rate lands');
    eq(filled.doc, empty.doc,

/* ── Runner ───────────────────────────────────────────────────────────────── */
/* ── The localhost gate ─────────────────────────────────────────────────────
   Booting the pages is itself the side effect worth guarding: they save their
   defaults and their jackpot caches the moment they load, and on the published
   site that is a visitor's own stored settings, on the origin every app in this
   family shares. So the frames are created only on a local server, and the
   check comes before they exist rather than inside their load handler.

   file:// is NOT in this list, deliberately: it has no hostname, and treating
   it as local would build frames a browser then blocks, leaving the page to
   blame the code for what is a setup problem. Same rule as the sibling apps.
─────────────────────────────────────────────────────────────────────────── */
/* ── Offline: the service worker ────────────────────────────────────────────
   Read as TEXT rather than exercised as a live worker, and that is the point
   rather than a shortcut: registration is frame-guarded, so this suite never
   installs one — a suite that did would be testing whatever that worker had
   cached instead of the files on disk.

   What is worth asserting is the SHAPE of the thing. Cache Storage is keyed by
   ORIGIN and shared with every sibling app, so "only files already public in
   this repo, ever" is the promise holding this up. */
let SW_SRC = '', KILL_SRC = '', INDEX_SRC = '', CALC_SRC = '', PORT_SRC = '', CHART_SRC = '',
    PKG = '', PRIVACY_SRC = '', TAX_SRC = '';
/* One cache-buster for this run, shared by the hidden frames and by every
   source fetch, so both are always looking at the same revision — and at the
   one on disk. Without it a browser will happily hand a frame a page it cached
   minutes ago: on 2026-08-22 this suite reported all-green against a portfolio
   page three features out of date, because the source-level tests were reading
   the file off the server while the frames ran yesterday's copy of it. A suite
   that can pass against a build which exists nowhere is worse than no suite. */
const BUST = '?t=' + Date.now();
/* The text a READER sees, tags removed. Deliberately a scanner and not
   `replace(/<[^>]+>/g, '')`: a single-pass tag strip is the shape CodeQL flags as
   incomplete multi-character sanitization, and it is right to — one pass over
   `<<p>p>` leaves a live tag behind. Nothing here is rendered, so the bug that
   shape would cause here is only a wrong CHARACTER COUNT, but the alert it raises
   is a real High sitting open on the security tab, where a true finding would be
   missed among it. Callers normalise whitespace themselves, as they did before. */
function visibleText(html) {
  let out = '', inTag = false;
  for (const ch of html) {
    if (ch === '<') { inTag = true; continue; }
    if (ch === '>') { inTag = false; continue; }
    if (!inTag) out += ch;
  }
  return out;
}

/* Loop until the source stops changing. A SINGLE pass is fooled by a comment
   that opens a second comment inside itself: one sweep closes at the first
   terminator and leaves the inner opener live. A helper that can be wrong about
   what is commented out is one that can miss a live off-origin script — which is
   the whole reason these suites read the source at all.
   (Written without quoting the character pair it is about, for the obvious
   reason: an earlier draft of this very comment embedded one and ended itself
   four lines early, turning its own remaining prose into live code.) */
const stripComments = (src) => {
  let out = src, prev;
  do { prev = out; out = out.replace(/\/\*[\s\S]*?\*\//g, '').replace(/^\s*\/\/.*$/gm, ''); }
  while (out !== prev);
  return out;
};

t('every parseInt spells out its radix', () => {

  const sources = { portfolio: PORT_SRC, calculator: CALC_SRC,
                    worker: SW_SRC, 'kill switch': KILL_SRC, index: INDEX_SRC };
  for (const [name, src] of Object.entries(sources)) {

t('package.json and the vendored bundle name the SAME Chart.js', () => {
  /* The manifest exists only so Dependabot has something to scan — nothing is
     ever installed from it, and the bytes that ship are chart.min.js in this
     repo. That creates one specific way to end up lying: Dependabot cannot
     re-vendor a file, so a version-bump PR would raise the manifest to 4.5.0
     while the app went on serving 4.4.1, and the repo would claim a version it
     does not run.

     This is what stops that being quiet. A manifest-only bump fails here, which
     turns the PR into the correct instruction — "a newer Chart.js exists, now
     update the FILE too, in all four repos" — rather than a false record. Same
     discipline as the theme pack's gate: a generated artefact must match its
     source. */
  const pinned = (PKG.match(/"chart\.js"\s*:\s*"([^"]+)"/) || [])[1];
  ok(pinned, 'package.json must declare chart.js');
  ok(/^\d+\.\d+\.\d+$/.test(pinned),
     'pin it exactly — a ^ or ~ range cannot be checked against a vendored file: ' + pinned);
  ok(CHART_SRC.includes('"' + pinned + '"'),
     'chart.min.js is not ' + pinned + ' — if this followed a Dependabot bump, the file '
     + 'still has to be re-vendored, and Flow Metrics and Money Map with it');
});
t('the manifest installs nothing and can never be published', () => {
  const pkg = JSON.parse(PKG);

  ok(!pkg.scripts, 'no scripts — this repo has no build step and must not grow one');
  ok(!pkg.dependencies, "the entry belongs in devDependencies, which CI's --omit=dev skips");
  ok(pkg.devDependencies && Object.keys(pkg.devDependencies).length === 1,

t('the worker deletes only its own caches', () => {
  const code = stripComments(SW_SRC);
  ok(/startsWith\(PREFIX\)/.test(code), 'activate must guard caches.delete with the prefix');
  ok(/const PREFIX = 'lot-shell-';/.test(SW_SRC), 'and the prefix must be this repo’s');
});

t('the worker is network-first, so cached code needs a failed network', () => {
  const code = stripComments(SW_SRC);
  ok(/Promise\.race/.test(code) && /cache\.match/.test(code), 'expected the network-first race');
  ok(!/caches\.match\(req\)\s*\.then\(\s*\(?r\)?\s*=>\s*r\s*\|\|/.test(code),
    'this looks cache-first — the whole design rests on network-first');
  ok(/!res\.ok && cached/.test(code),
    'a same-origin error reply with a cached copy in hand must serve the cache');
  /* The bug this line exists for was in all six workers from the day they
     shipped: a bare `fetch(req)` keeps the cache mode of the request the page
     made, so an ordinary reload was answered by the browser's own HTTP cache
     and the fresh deploy sitting on Pages went unseen for its `max-age`. */
  ok(/fetch\(req, \{ cache: 'no-cache' \}\)/.test(code),
    'the serving fetch must opt out of the HTTP cache, or network-first is a name only');
  ok(!/fetch\(req\)/.test(code),
    'a bare fetch(req) is the bug \u2014 it inherits the page request\u2019s cache mode');
});

t('a missing shell file can be repaired without a new worker version', () => {
  const code = stripComments(SW_SRC);
  ok(/addEventListener\(\s*'message'/.test(code) && /'shell-check'/.test(code),
    'the worker must accept a shell-check message');
  ok(!/addAll/.test(code), 'addAll rejects the whole precache on a single 404, silently');
  ok(/e\.data\.type !== 'shell-check'\) return;/.test(code),
    'the message handler must reject anything but shell-check');
  ok(!/e\.data\.(url|urls|path|cache|key)/.test(code),
    'and must never read a URL or cache name out of a message');
});

t('the kill switch stays a pure uninstaller', () => {

  ok(!/addEventListener\(\s*'fetch'/.test(code), 'and intercept nothing — inert is the point');
  ok(!/cache\.put|addAll/.test(code), 'and never cache anything');

t('all three pages register the worker, frame-guarded, after load', () => {
  /* Whichever page you open first installs it, and all three are in its scope —
     so someone who bookmarked the calculator gets offline too. The frame guard
     is what stops this very suite installing one while it runs. */
  for (const [name, src] of [['index.html', INDEX_SRC], ['the calculator', CALC_SRC],
                             ['the portfolio', PORT_SRC]]) {
    ok(/navigator\.serviceWorker\.register\('sw\.js', \{ scope: '\.\/' \}\)/.test(src),
      `${name} must register the worker`);
    ok(/window\.top !== window\.self/.test(src),
      `${name}'s registration must skip frames, or this suite would install one`);
    ok(/window\.addEventListener\('load', function \(\) \{/.test(src),
      `${name} must wait for load rather than compete with first paint`);
    ok(/if \(reg\.active\) reg\.active\.postMessage\(\{ type: 'shell-check' \}\)/.test(src),
      `${name} must ask for a shell check on load`);
    const csp = (src.match(/http-equiv="Content-Security-Policy" content="([^"]+)"/) || [])[1] || '';
    ok(/worker-src 'self'/.test(csp),
      `${name}'s CSP must spell out worker-src 'self', not lean on the fallback chain`);
    ok(!/worker-src[^;]*https?:/.test(csp), `${name}'s worker-src must admit no off-origin host`);
  }
});

t('every disclosure on the calculator opens expanded', () => {

/* ── The working under the answer is the working FOR the answer ──────────────
   Reported 2026-08-22. The effective rate and the whole tax breakdown were the
   LUMP SUM's on every tab but Annuity — so on Compare, the tab whose entire job

t('one decision picks the winner, and everything that must agree reads it', () => {

  ok(!/wantsAnnuity/.test(code),
    'wantsAnnuity is back: the schedule is deciding for itself whether the annuity is '
    + 'what the page is describing, and on Compare its answer is wrong half the time');

  ok(/annuityAhead *= *\(a && b\) \? \(a\.pvNet >= b\.net\)/.test(code),

     what the family sweep found the two textContent apps lacking on
     2026-08-23 — but "Withheld at Payment" still had no bold in it at all, so
     a reader had nothing to skim by. The rule the family settled on: a note
     over about 380 characters is paragraphs, every note bolds the thing it is
     defining or the claim it turns on, and no note has more bold runs than
     paragraphs, because a note half in bold has no emphasis left. */
  for (const [page, src, decl] of [['the calculator', CALC_SRC, 'var HELP = {'],
                                   ['the portfolio', PORT_SRC, 'var HELP = {']]) {
    const at = src.indexOf(decl);
    const table = src.slice(at, src.indexOf('\n};', at));
    /* SPLIT on the entry boundary, not matchAll with a `$` alternative: under
       the m flag `$` is end-of-LINE, so the lazy body stopped at the first
       newline and every entry looked like a single paragraph. */
    const bodies = table.split(/\n  (?=\w+: \[)/).slice(1)
      .map((chunk) => [null, chunk.split(':')[0].trim(), chunk]);
    ok(bodies.length >= 3, page + ' — found ' + bodies.length + ' entries');
    for (const [, key, chunk] of bodies) {
      const paras = (chunk.match(/<p>/g) || []).length;
      const bolds = (chunk.match(/<strong>/g) || []).length;
      ok(paras >= 2, page + ': ' + key + ' is a single paragraph');
      ok(bolds >= 1, page + ': ' + key + ' bolds nothing — the reader has no way in');
      /* A SHARE OF THE CHARACTERS, not a count per paragraph: a note that
         defines a list bolds one term per item and is right to. What goes
         wrong is bold stopping being the minority. */
      const text = visibleText(chunk).replace(/['`+\n]/g, ' ').replace(/\s+/g, ' ').length;
      const boldText = visibleText((chunk.match(/<strong>([\s\S]*?)<\/strong>/g) || [])
        .join('')).replace(/['`+\n]/g, ' ').replace(/\s+/g, ' ').length;
      ok(bolds >= 1 && boldText / text < 0.4,
         page + ': ' + key + ' — bold must be a minority of the note');
    }
  }
});

const LOCAL_HOSTS = ['localhost', '127.0.0.1', '[::1]'];

/* The offline group reads files rather than frames, so it is fetched here and
   handed to run() — the test bodies themselves stay synchronous, like every
   other one on this page. A missing file leaves its variable empty and fails
   its own test rather than taking the suite down. */
async function loadSources() {
  /* Same buster the frames use. Without it the source-level tests read the
     file off the server while the frames ran a cached copy — or, worse, both
     read caches of different ages and the suite reported green against a build
     that does not exist anywhere. */
  const grab = async (f) => { try { const r = await fetch(f + BUST, { cache: 'no-store' }); return r.ok ? await r.text() : ''; } catch (e) { return ''; } };
  [SW_SRC, KILL_SRC, INDEX_SRC, CALC_SRC, PORT_SRC, CHART_SRC, PKG, PRIVACY_SRC, TAX_SRC] =
    await Promise.all(
    [grab('sw.js'), grab('sw-kill.js'), grab('index.html'),
     grab('ny-lottery-calculator.html'), grab('lottery-portfolio.html'),
     grab('chart.min.js'), grab('package.json'), grab('privacy.html'),
     grab('tax.js')]);
}

window.addEventListener('load', () => {
  if (!LOCAL_HOSTS.includes(location.hostname)) return refuse();
  const frame = (id, src, title) => {
    const f = document.createElement('iframe');
    f.id = id; f.src = src + BUST; f.title = title;
    /* Both apps' frame-busters break out of any framer that does NOT carry
       this attribute — it is what marks these frames as the one legitimate,
       same-origin exception. */
    f.setAttribute('data-lottery-tests', '');
    f.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none';
    document.body.appendChild(f);
    return f;
  };
  const calc = frame('calc', 'ny-lottery-calculator.html', 'calculator under test');
  const port = frame('port', 'lottery-portfolio.html', 'portfolio under test');
  /* Both pages are classic scripts at the foot of the body, so their function
     declarations exist by each frame's load event; poll for both frames. */
  const ready = () => calc.contentWindow.parseField && port.contentWindow.computeIncome;
  /* Bounded, because the un-bounded version polled for ever: opened off disk
     (file:// frames are blocked) or with nothing serving the folder, the frames
     never become ready and the page just sat there saying "Loading" with no
     hint that the setup, not the code, was the problem. Five seconds is far
     longer than two local frames need. */
  const giveUpAt = Date.now() + 5000;
  const tick = () => {
    if (ready()) return loadSources().then(run);
    if (Date.now() < giveUpAt) return setTimeout(tick, 100);
    const s = document.getElementById('summary');
    s.className = 'bad';
    s.textContent = 'The hidden frames never loaded the pages — is this folder being served?';
    document.getElementById('out').innerHTML =
      '<tr><td class="msg" style="white-space:normal;font-family:inherit;font-size:13px">' +
      'This page tests the real calculator and portfolio in hidden frames, and a browser ' +
      'blocks those when it is opened straight off disk. Run <code>cd ~/claude-lottery ' +
      '&amp;&amp; python3 -m http.server 8010</code> and open ' +
      '<code>http://localhost:8010/tests.html</code>.</td></tr>';
  };
  setTimeout(tick, 150);
});

/* Two reasons to land here, needing different sentences: the published site
   (where booting the pages would write into a visitor's own saved settings) and
   a file:// copy off disk (where it cannot work at all — browsers block file://
   frames). Both end at the same instruction. */
function refuse() {
  const onDisk = location.protocol === 'file:';
  const s = document.getElementById('summary');
  s.className = 'bad';
  s.textContent = onDisk
    ? 'Not run from a file — this page needs a local server.'
    : 'Not run here — this page boots live copies of the pages it tests.';
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = 3;
  td.style.cssText = 'font-size:13px;line-height:1.6';
  td.innerHTML = (onDisk
    ? 'The suite loads the calculator and the portfolio in hidden frames to test them, and a '
      + 'browser blocks those frames when the page is opened straight off disk — so the tests '
      + 'would have nothing to run against. Serve the folder instead:'
    : 'The suite loads the calculator and the portfolio in hidden frames to test them. On '
      + '<strong></strong> those pages would save their defaults into your own browser storage. '
      + 'It runs on <code>localhost</code> only, against a copy served from the repo folder:') +
    '<br><br><code>cd ~/claude-lottery &amp;&amp; python3 -m http.server 8010</code><br>' +
    'then open <code>http://localhost:8010/tests.html</code>.<br><br>' +
    'Nothing has been changed by opening this page — ' +
    '<a href="ny-lottery-calculator.html">back to the calculator</a>.';
  if (!onDisk) td.querySelector('strong').textContent = location.hostname;
  tr.appendChild(td);
  document.getElementById('out').appendChild(tr);
  showLatestRun();
}


/* ── The scorecard, where the suite itself can't run ─────────────────────────
   Refusing to run and then saying nothing about whether the tests pass is half
   an answer: the question someone opens this page to ask is "is it green?".
   The same suite runs headless in CI on every push, so ask GitHub how that went
   and show it here. Nothing is booted and nothing is stored — it is one public,
   unauthenticated read of a workflow's run list.
─────────────────────────────────────────────────────────────────────────── */
function showLatestRun() {
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = 3;
  td.style.cssText = 'font-size:14px;line-height:1.6;padding:12px 16px';
  td.textContent = 'Checking the latest CI run…';
  tr.appendChild(td);
  document.getElementById('out').appendChild(tr);

  fetch('https://api.github.com/repos/eagleadams86/lottery/actions/workflows/tests.yml/runs?branch=main&per_page=1')
    .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
    .then((d) => {
      const run = d && d.workflow_runs && d.workflow_runs[0];
      if (!run) { td.textContent = 'No CI runs found for this repository yet.'; return; }
      const done = run.status === 'completed';
      const okRun = run.conclusion === 'success';
      tr.className = !done ? '' : (okRun ? 'pass' : 'fail');
      const when = run.updated_at ? new Date(run.updated_at).toLocaleString() : '';
      const sha = String(run.head_sha || '').slice(0, 7);
      /* Only ever build an <a> when the API really did hand back a GitHub https
         URL — the same guard the app uses for any URL out of an API. */
      const url = String(run.html_url || '');
      td.textContent = (!done ? '⏳ The latest run is still going'
        : okRun ? '✓ The full suite passed in CI' : '✕ The suite FAILED in CI')
        + (when ? ' — ' + when : '') + (sha ? ' · commit ' + sha : '') + '. ';
      if (/^https:\/\/github\.com\//.test(url)) {
        const a = document.createElement('a');
        a.href = url; a.rel = 'noopener noreferrer';
        a.textContent = 'Open the run for the full scorecard';
        td.appendChild(a);
      }
    })
    .catch(() => { td.textContent = 'Could not reach GitHub to check the latest CI run.'; });
}

/* ── Select-on-focus versus a number field’s spin arrows ──────────────────
   Clicking a box selects what is in it, which takes cancelling the mouseup —
   that is what would otherwise place the caret and collapse the selection.
   Chrome’s number spinner ALSO ends its press on the mouseup’s default action:
   it repeats while an arrow is held down and stops when the release is allowed
   through. Cancelling it there left ONE click on a down arrow running the value
   all the way to its minimum (found in Flow Metrics, 2026-08-21).

   Press, focus and release are all dispatched by hand, for two reasons: a
   synthetic press never reaches the browser’s own spin button, and focus()
   inside a frame nobody is looking at sets activeElement without firing focusin
   until the frame is focused. So what a real click looks like is not observable
   from here — but the DECISION the guard makes is, and the decision is the part
   that was wrong. The value moving between the press and the release means a
   spin, and a spin has no caret to protect. Both pages here carry the block, so
   both are asked — the two files are edited separately and only one of them has
   the jackpot boxes people actually spin. */
function spinProbe(appWin, setUp) {
  const box = appWin.document.createElement('input');
  box.type = 'number'; box.value = '14'; box.min = '1';
  appWin.document.body.appendChild(box);
  try {
    setUp(box);
    const up = new appWin.MouseEvent('mouseup', { bubbles: true, cancelable: true });
    box.dispatchEvent(up);
    return up.defaultPrevented;
  } finally {
    /* Releases the pointer flag as a real release would; without it the next
       probe would inherit a press that never ended. */
    box.dispatchEvent(new appWin.PointerEvent('pointerup', { bubbles: true }));
    box.remove();
  }
}
function spinFocusIn(appWin, el) { el.dispatchEvent(new appWin.FocusEvent('focusin', { bubbles: true })); }
function spinPress(appWin, el)   { el.dispatchEvent(new appWin.PointerEvent('pointerdown', { bubbles: true })); }

/* getWin is a thunk: the frames don't exist until run() assigns them. */
function spinCases(where, getWin) {
  t('a plain click keeps the select-all — ' + where, () => {
    const W = getWin();
    ok(spinProbe(W, (box) => { spinPress(W, box); spinFocusIn(W, box); }));
  });
  t('a spin press is let through, so the browser stops repeating — ' + where, () => {
    const W = getWin();
    eq(spinProbe(W, (box) => { spinPress(W, box); spinFocusIn(W, box); box.value = '13'; }), false);
  });
  t('a click on the label still selects — ' + where, () => {
    const W = getWin();
    ok(spinProbe(W, (box) => {
      /* No press on the box of its own to compare against, so the value as it
         stands at focus stands in and that path is left as it was. */
      const lab = W.document.createElement('label');
      W.document.body.appendChild(lab);
      spinPress(W, lab); spinFocusIn(W, box); lab.remove();
    }));
  });
  t('a focus with no press behind it guards nothing — ' + where, () => {
    const W = getWin();
    eq(spinProbe(W, (box) => { spinFocusIn(W, box); }), false);
  });
}
/* ══════════════════════════════════════════════════════════════════════════
   The keyboard ring on the three boxes this calculator is driven from.

   `outline: none` on `.input-card input[type=text]` and `.ctrl-row
   input[type=number]` is the usual idiom for killing the browser's own ring on
   a box you have styled. But written on the BASE rule both are (0,2,1), and the
   `input:focus-visible` rule at the top of the file is (0,1,1) — so they were
   killing the app's own ring too. Nothing looked broken: the underline still
   changed from --input-border to --focus-border, which measures 1.5px and
   1.48:1 between the two states, against the 2px perimeter at 3:1 that WCAG 2.2
   SC 2.4.11 asks for.

   RESOLVED THROUGH THE CASCADE, not by focusing anything. The first version of
   this group did focus each box and read back the computed outline, which
   passed here and failed in CI: whether a programmatic focus counts as
   :focus-visible is a browser heuristic, and it does not survive a headless
   runner that never had window focus. The bug was never about focus anyway — it
   was about which rule wins — so the test now asks that directly: collect every
   rule that sets an outline and matches the element, rank them the way the
   cascade does, and look at what the winner says. Deterministic in any browser,
   and it still fails on the exact mistake, because the winner then is the one
   saying `none`. */
group('The focus ring on the calculator’s own boxes');

/* [id, class/attribute/pseudo-class, type] — CSS specificity, enough of it for
   the selectors on this page. Pseudo-ELEMENTS are stripped before pseudo-classes
   so `::before` is not counted as a class. */
function specOf(sel) {
  let s = ' ' + sel.trim() + ' ', a = 0, c = 0, e = 0;
  s = s.replace(/\[[^\]]*\]/g, () => { c++; return ' '; });
  s = s.replace(/::[a-z-]+/g, () => { e++; return ' '; });
  s = s.replace(/:[a-z-]+(\([^)]*\))?/g, () => { c++; return ' '; });
  s = s.replace(/#[\w-]+/g, () => { a++; return ' '; });
  s = s.replace(/\.[\w-]+/g, () => { c++; return ' '; });
  s.split(/[\s>+~]+/).forEach((x) => { if (/^[a-zA-Z][\w-]*$/.test(x)) e++; });
  return [a, c, e];
}
/* Which rule the browser would land on for this element in its focus-visible
   state: highest specificity, and the later one on a tie. */
function winningOutlineRule(W, el) {
  const hits = [];
  let order = 0;
  const walk = (rules) => {
    for (const r of rules) {
      order++;
      if (r.cssRules && !r.selectorText) { walk(r.cssRules); continue; }
      if (!r.selectorText || !r.style) continue;
      if (!r.style.outline && !r.style.outlineStyle && !r.style.outlineWidth) continue;
      for (const raw of r.selectorText.split(',')) {
        const sel = raw.trim();
        /* Ask whether the ELEMENT matches, with the state pseudo-class removed —
           then rank by the selector as it is actually written, which is where
           that pseudo-class earns its point. */
        const base = sel.replace(/:focus-visible\b/g, '').trim() || '*';
        let m = false;
        try { m = el.matches(base); } catch (err) { m = false; }
        if (m) hits.push({ sel: sel, order: order, spec: specOf(sel), style: r.style });
      }
    }
  };
  for (const sheet of W.document.styleSheets) {
    let rules; try { rules = sheet.cssRules; } catch (err) { continue; }
    walk(rules);
  }
  hits.sort((x, y) => (x.spec[0] - y.spec[0]) || (x.spec[1] - y.spec[1])
    || (x.spec[2] - y.spec[2]) || (x.order - y.order));
  return hits[hits.length - 1] || null;
}

/* A shorthand holding a var() cannot be decomposed, so `outlineWidth` and
   friends come back EMPTY for the ring rule while `outline: none` decomposes
   perfectly — read the whole declaration back as text and there is one answer
   for both. Reading the longhands alone is how the first draft of this managed
   to report "the ring is at least 2px" as a failure against the fixed page. */
function outlineOf(st) {
  const text = (st.outline
    || [st.outlineWidth, st.outlineStyle, st.outlineColor]
      .filter((v) => v && v !== 'initial').join(' ')).trim();
  const px = /(?:^|\s)(\d*\.?\d+)px/.exec(text);
  return { text: text, width: px ? parseFloat(px[1]) : 0,
           isNone: /(^|\s)none(\s|$)/.test(text) };
}

t('every box the calculator is driven from wins a ring, not an `outline: none`', () => {
  const W = wc, d = W.document;
  ['jackpot-input', 'lump-input', 'npeople'].forEach((id) => {
    const el = d.getElementById(id);
    ok(el, id + ' is on the page at all — without it the rest of this proves nothing');
    const win = winningOutlineRule(W, el);
    ok(win, id + ' is matched by some rule that sets an outline');
    const o = outlineOf(win.style);
    ok(!o.isNone,
      id + ': the rule that WINS is `' + win.sel + '`, and it says outline: ' + o.text);
    ok(o.width >= 2,
      id + ': the ring is at least 2px, not the 1.5px underline left behind when '
        + 'the base rule wins', o.text);
    ok(/--focus-border/.test(o.text),
      id + ': and it is the theme’s focus colour rather than one of its own', o.text);
  });
});
t('the ring stands off the box rather than sitting on its border', () => {
  const W = wc, d = W.document;
  ['jackpot-input', 'lump-input', 'npeople'].forEach((id) => {
    const win = winningOutlineRule(W, d.getElementById(id));
    ok(win && parseFloat(win.style.outlineOffset) > 0,
      id + ' offsets its ring, so it reads against the border already there',
      win && win.style.outlineOffset);
  });
});

group('Select-on-focus versus a number field’s spin arrows');
spinCases('the calculator', () => wc);
spinCases('the portfolio', () => wp);

/* ══════════════════════════════════════════════════════════════════════════
   CSV injection — the guard both pages went without until 2026-08-25.

   Neither page has a free-text field: every cell either side of this is a fixed
   label or a rounded number, so there was nothing to inject and nothing looked
   wrong. That is exactly why it was worth closing — the family's other six
   exporters all defuse, and the day somebody adds a field that carries typing,
   the exporter it lands in should already be the safe one. */
group('csvCell — a spreadsheet formula is defused, a number is not');

function csvCases(label, W) {
  t(label + ': a leading = is defused', () => {
    eq(W().csvCell('=1+1'), '"\'=1+1"');
  });
  t(label + ': the other three formula leads are defused', () => {
    eq(W().csvCell('+SUM(A1)'), '"\'+SUM(A1)"');
    eq(W().csvCell('@SUM(A1)'), '"\'@SUM(A1)"');
    eq(W().csvCell('-1+1'), '"\'-1+1"');
  });
  /* The reason this is two tests and not one: `-` leads the risky set, and every
     negative figure in these tables starts with it. Defusing on the first
     character alone would hand the spreadsheet a column of text. */
  t(label + ': a plain negative number is left alone', () => {
    eq(W().csvCell(-1234), '"-1234"');
    eq(W().csvCell('-12.5'), '"-12.5"');
    eq(W().csvCell(0), '"0"');
  });
  t(label + ': quotes are doubled and every cell is quoted', () => {
    eq(W().csvCell('say "hi"'), '"say ""hi"""');
    eq(W().csvCell('a,b'), '"a,b"');
  });
  t(label + ': null and undefined become an empty cell, not the word', () => {
    eq(W().csvCell(null), '""');
    eq(W().csvCell(undefined), '""');
  });
}
csvCases('the calculator', () => wc);
csvCases('the portfolio', () => wp);

function run() {
  wc = document.getElementById('calc').contentWindow;
  wp = document.getElementById('port').contentWindow;
  const out = document.getElementById('out');
  let pass = 0, fail = 0;
  for (const item of TESTS) {
    if (item.group) {
      const tr = document.createElement('tr');
      tr.className = 'group';
      tr.innerHTML = '<td colspan="3"></td>';
      tr.firstChild.textContent = item.group;
      out.appendChild(tr);
      continue;
    }
    const tr = document.createElement('tr');
    const st = document.createElement('td'); st.className = 'st';
    const name = document.createElement('td'); name.textContent = item.name;
    const msg = document.createElement('td'); msg.className = 'msg';
    try {
      item.fn();
      tr.className = 'pass'; st.textContent = '✓'; pass++;
    } catch (e) {
      tr.className = 'fail'; st.textContent = '✕'; msg.textContent = e.message; fail++;
    }
    tr.appendChild(st); tr.appendChild(name); tr.appendChild(msg);
    out.appendChild(tr);
  }
  /* The floor — see EXPECTED at the top of this file. Written as a row of its
     own so it reads like any other failure, and counted into `fail` so the
     summary goes red and CI's `All N tests pass` check does not match. */
  if (pass + fail < EXPECTED) {
    const tr = document.createElement('tr');
    tr.className = 'fail';
    const st = document.createElement('td'); st.className = 'st'; st.textContent = '\u2715';
    const name = document.createElement('td');
    name.textContent = 'the suite ran only ' + (pass + fail) + ' of at least '
      + EXPECTED + ' tests';
    const msg = document.createElement('td'); msg.className = 'msg';
    msg.textContent = 'tests have gone missing rather than failed, so a green result here '
      + 'would cover a fraction of the suite. If they were retired on purpose, lower '
      + 'EXPECTED to match.';
    tr.appendChild(st); tr.appendChild(name); tr.appendChild(msg);
    out.appendChild(tr);
    fail++;
  }
  const s = document.getElementById('summary');
  s.textContent = fail === 0 ? `All ${pass} tests pass` : `${fail} of ${pass + fail} tests FAILED`;
  s.className = fail === 0 ? 'ok' : 'bad';
  document.title = (fail === 0 ? '✓ ' : '✕ ') + document.title;
}
