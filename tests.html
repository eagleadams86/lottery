<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<!-- Every page on the shared origin ships a CSP (the family security rule) —
     this one is published on GitHub Pages beside the pages it tests, so it is
     as much a page on the origin as they are. connect-src 'self' is for reading
     sw.js and the pages as text (the offline group below pins their shape),
     api.github.com for the CI-scorecard line, and frame-src 'self' for the two
     harness iframes, whose content is then governed by each page's own CSP.
     `style-src 'self'` is what lets theme.css load, so this page wears the same
     palette as the pages it tests. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self' https://api.github.com; frame-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lottery — Tests</title>
<style>
  /* Dev-only page: pins the pure functions in BOTH apps — the calculator's
     input/API boundaries (parseField, ball, fmtDrawDate, the block builders)
     and tax arithmetic (taxBreakdown), and the portfolio's income model
     (computeIncome, parseLatest1yr) and input boundary (syncSlider). Loads
     each real page in a hidden same-origin iframe and calls its functions
     directly, so what's tested is what ships. Serve over http://localhost
     (python3 -m http.server 8010); file:// iframes are blocked in some
     browsers. The apps' own boot code runs (theme write, jackpot/winning
     fetches that fail harmlessly off the live origin) — the pure-function
     tests add no writes of their own; only the syncSlider group drives a
     real handler whose render() saves slider state, into the localhost
     copy's storage the localhost gate already confines it to. Colours are
     the Midnight palette from the theme pack (dev page, hardcoded). */
  body { background: #0a0e1a; color: #e7eaf6; margin: 0;
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #838cab; font-size: 12.5px; margin: 0 0 18px; }
  #summary { font-weight: 600; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px;
             border: 1px solid #262f4a; background: #121829; }
  #summary.ok  { color: #72fe84; border-color: #72fe84; }
  #summary.bad { color: #fb7874; border-color: #fb7874; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 8px; border-bottom: 1px solid #262f4a; vertical-align: top; }
  td.st { width: 28px; font-weight: 700; }
  tr.pass td.st { color: #72fe84; }
  tr.fail td.st { color: #fb7874; }
  tr.fail td.msg { color: #fb7874; }
  .msg { color: #838cab; font-size: 12px; white-space: pre-wrap; }
  .group td { padding-top: 16px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
              text-transform: uppercase; color: #838cab; border-bottom-color: #374163; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Lottery — Pure-Function Tests</h1>
  <p class="sub">Runs against the real <code>ny-lottery-calculator.html</code> and <code>lottery-portfolio.html</code> in hidden iframes.</p>
  <div id="summary">Loading apps…</div>
  <table><tbody id="out"></tbody></table>
</div>
<!-- The two frames are built in script, not here: they boot the real pages, so
     they must not exist until the localhost gate at the foot of this file has
     passed. -->

<script>
'use strict';
const TESTS = [];
function group(name) { TESTS.push({ group: name }); }
function t(name, fn) { TESTS.push({ name, fn }); }
function eq(actual, expected, note) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a !== e) throw new Error((note ? note + ': ' : '') + 'expected ' + e + ', got ' + a);
}
function ok(cond, note) { if (!cond) throw new Error(note || 'expected truthy'); }
/* Money figures come out of float multiplication, so exact eq() would pin
   rounding noise instead of the model. Within a dollar is equality here. */
function near(actual, expected, note) {
  if (Math.abs(actual - expected) > 1)
    throw new Error((note ? note + ': ' : '') + 'expected ~' + expected + ', got ' + actual);
}
let wc, wp; // the two app iframes' windows

/* Set an input's value directly — no events fired, so the app's handlers
   (and calc()'s localStorage write) never run. */
function setBox(win, id, v) { win.document.getElementById(id).value = v; }

group('parseField — the manual-amount boundary (calculator)');
t('a bare number takes the active unit', () => {
  setBox(wc, 'jackpot-input', '238');
  eq(wc.parseField('jackpot-input', 'M'), 238e6);
  eq(wc.parseField('jackpot-input', 'B'), 238e9);
});
t('a typed M/B suffix overrides the unit toggle, either case', () => {
  setBox(wc, 'jackpot-input', '1.5B');
  eq(wc.parseField('jackpot-input', 'M'), 1.5e9);
  setBox(wc, 'jackpot-input', '106m');
  eq(wc.parseField('jackpot-input', 'B'), 106e6);
});
t('dollar signs, commas and spaces are stripped first', () => {
  setBox(wc, 'jackpot-input', '$1,000 ');
  eq(wc.parseField('jackpot-input', 'M'), 1000e6);
});
t('malformed numbers are rejected outright, not partially parsed', () => {
  setBox(wc, 'jackpot-input', '1.2.3');
  eq(wc.parseField('jackpot-input', 'M'), null, '"1.2.3" must not quietly read as 1.2');
  setBox(wc, 'jackpot-input', 'abc');
  eq(wc.parseField('jackpot-input', 'M'), null);
});
t('an empty box is null (meaning: estimate the lump at 60%)', () => {
  setBox(wc, 'jackpot-input', '');
  eq(wc.parseField('jackpot-input', 'M'), null);
});

group('ball / fmtDrawDate / block builders — the API-data allowlist');
t('ball() renders only one or two digits; anything else is nothing', () => {
  ok(wc.ball('7').includes('>7<'), 'a plain number renders');
  eq(wc.ball('123'), '', 'three digits rejected');
  eq(wc.ball('<img src=x onerror=alert(1)>'), '', 'markup rejected');
  eq(wc.ball(null), '');
  eq(wc.ball(' 12 ').includes('>12<'), true, 'whitespace is trimmed first');
});
t('fmtDrawDate() only accepts YYYY-MM-DD-shaped input', () => {
  ok(wc.fmtDrawDate('2026-08-07').includes('Aug 7, 2026'));
  eq(wc.fmtDrawDate('javascript:alert(1)'), '');
  eq(wc.fmtDrawDate(''), '');
});
t('a hostile API payload renders as empty chrome, never as markup', () => {
  const r = { winning_numbers: '<script>alert(1)<\/script>', mega_ball: '"><img src=x>',
              multiplier: '<b>', draw_date: '<svg onload=x>' };
  const out = wc.pbBlock(r) + wc.mmBlock(r);
  ok(!/onerror|onload|<script|<img|<svg/.test(out), 'no hostile markup survives: ' + out);
});
t('a real Powerball result renders six balls and the multiplier', () => {
  const out = wc.pbBlock({ winning_numbers: '5 12 23 34 45 6', multiplier: '3', draw_date: '2026-08-05' });
  eq((out.match(/class="ball/g) || []).length, 6);
  ok(out.includes('Power Play'), 'multiplier shown');
  ok(out.includes('Aug 5, 2026'), 'draw date shown');
});
t('a real Mega Millions result renders five whites plus the mega ball', () => {
  const out = wc.mmBlock({ winning_numbers: '5 12 23 34 45', mega_ball: '7', draw_date: '2026-08-04' });
  eq((out.match(/class="ball/g) || []).length, 6);
});

group('calculator formatters');
t('fmt() rounds to whole dollars with separators; null and NaN are an em dash', () => {
  eq(wc.fmt(1234567.4), '$1,234,567');
  eq(wc.fmt(null), '—');
  eq(wc.fmt(NaN), '—');
});
t('fmtM() trims trailing zeros; fmtM1() always keeps one decimal', () => {
  eq(wc.fmtM(1.5e9), '$1.5B');
  eq(wc.fmtM(2e9), '$2B');
  eq(wc.fmtM(238e6), '$238M');
  eq(wc.fmtM1(238e6), '$238.0M');
  eq(wc.fmtM1(1.5e9), '$1.5B');
});

group('winnersValue — the split-count clamp');
t('typed values outside 1–1000 are clamped, junk becomes 1', () => {
  setBox(wc, 'npeople', '5000'); eq(wc.winnersValue(), 1000);
  setBox(wc, 'npeople', '-3');   eq(wc.winnersValue(), 1);
  setBox(wc, 'npeople', 'abc');  eq(wc.winnersValue(), 1);
  setBox(wc, 'npeople', '7');    eq(wc.winnersValue(), 7);
  setBox(wc, 'npeople', '1');
});

group('nextDraw — schedule invariants (time-of-day dependent, so invariants only)');
t('a game drawn every day is always Tonight or Tomorrow', () => {
  ok(['Tonight', 'Tomorrow'].includes(wc.nextDraw([0, 1, 2, 3, 4, 5, 6])));
});
t('the real schedules always produce a label', () => {
  ok(wc.nextDraw([1, 3, 6]).length > 0, 'Powerball (Mon/Wed/Sat)');
  ok(wc.nextDraw([2, 5]).length > 0, 'Mega Millions (Tue/Fri)');
});

group('tax rates — the constants the page footnote promises');
t('withholding and top marginal rates match the published note', () => {
  eq(wc.FED_WH, 0.24); eq(wc.FED_TOP, 0.37);
  eq(wc.NY_WH, 0.105); eq(wc.NY_TOP, 0.109);
});

group('taxBreakdown — the arithmetic behind calc() (calculator)');
t('one winner: withholding, return top-up and net all follow from the rates', () => {
  const b = wc.taxBreakdown(100e6, 1);
  near(b.share, 100e6);
  near(b.fedWH, 24e6); near(b.nyWH, 10.5e6);
  near(b.afterWH, 100e6 - 34.5e6, 'received after withholding');
  near(b.fedX, 13e6, 'the 37% − 24% federal gap');
  near(b.nyX, 400e3, 'the 10.9% − 10.5% NY gap');
  near(b.net, 100e6 * (1 - 0.37 - 0.109));
  ok(Math.abs(b.eff - 0.479) < 1e-9, 'effective rate is the two top rates combined');
});
t('splitting divides the share before any tax is applied', () => {
  const b = wc.taxBreakdown(100e6, 4);
  near(b.share, 25e6);
  near(b.net, wc.taxBreakdown(25e6, 1).net, 'a quarter share taxes like a $25M win');
});
t('a typed $0 lump is a real answer: all zeros, never NaN', () => {
  const b = wc.taxBreakdown(0, 1);
  eq(b.share, 0); eq(b.net, 0);
  eq(b.eff, 0, '0/0 must not surface as "NaN%" on screen');
});

group('computeIncome — the portfolio allocation model');
t('when the 8-year ladder fits, buckets sum to exactly the portfolio', () => {
  const m = wp.computeIncome(100e6, 250e3, 0.04, 0.03, 0.013, 0.02, 0.6);
  near(m.spaxx, 250e3, '1 year of spending');
  near(m.tbill, 750e3, '3 years');
  near(m.muni, 1e6, '4 years');
  near(m.spaxx + m.tbill + m.muni + m.vti + m.vxus, 100e6, 'allocations add to the total');
  near(m.vti, 98e6 * 0.6, 'equity split honoured');
  eq(m.underfunded, false);
});
t('spending past total/8 shrinks all three buckets by one factor — no invented principal', () => {
  const m = wp.computeIncome(5e6, 1e6, 0.04, 0.03, 0.013, 0.02, 0.6);
  eq(m.underfunded, true);
  near(m.spaxx + m.tbill + m.muni, 5e6, 'the scaled ladder is the whole portfolio');
  near(m.vti + m.vxus, 0, 'nothing left for equities');
  near(m.tbill / m.spaxx, 3, 'buckets keep their 1:3:4 proportions');
});
t('tax treatment per holding: munis free, T-bills federal-only, equities LTCG+NIIT+NY', () => {
  const m = wp.computeIncome(100e6, 250e3, 0.04, 0.03, 0.013, 0.02, 0.6);
  near(m.muA, m.muG, 'muni income is untaxed');
  near(m.tbA, m.tbG * (1 - 0.37), 'T-bills exempt from NY, not federal');
  near(m.vtiA, m.vtiG * (1 - 0.20 - 0.038 - 0.109), 'qualified dividends');
});
t('totals are the sum of their parts, and tax only ever reduces income', () => {
  const m = wp.computeIncome(40e6, 400e3, 0.045, 0.028, 0.015, 0.025, 0.7);
  near(m.totG, m.spaxxG + m.tbG + m.muG + m.vtiG + m.vxusG);
  near(m.totA, m.spaxxA + m.tbA + m.muA + m.vtiA + m.vxusA);
  ok(m.totA <= m.totG, 'after-tax never exceeds gross');
});

group('parseLatest1yr — the Treasury feed parser');
const XML =
  '<entry><content><d:NEW_DATE m:type="Edm.DateTime">2026-08-03T00:00:00</d:NEW_DATE>' +
  '<d:BC_1YEAR m:type="Edm.Double">4.21</d:BC_1YEAR></content></entry>' +
  '<entry><content><d:NEW_DATE m:type="Edm.DateTime">2026-08-04T00:00:00</d:NEW_DATE>' +
  '<d:BC_1YEAR m:type="Edm.Double">4.05</d:BC_1YEAR></content></entry>';
t('picks the most recent entry in the sheet', () => {
  eq(wp.parseLatest1yr(XML), { rate: 4.05, date: '2026-08-04T00:00:00' });
});
t('an empty or rate-less sheet is null, not a crash (early-month case)', () => {
  eq(wp.parseLatest1yr(''), null);
  eq(wp.parseLatest1yr('<feed>no observations yet</feed>'), null);
  eq(wp.parseLatest1yr(XML.replace('4.05', 'N/A')), null, 'a non-numeric latest rate is rejected');
});
t('ymStr formats the Treasury month key with zero padding', () => {
  eq(wp.ymStr(new Date(2026, 0, 15)), '202601');
  eq(wp.ymStr(new Date(2026, 11, 1)), '202612');
});

group('portfolio formatters + tint');
t('fm() scales with magnitude; fmShort() trims; fm1() keeps one decimal', () => {
  eq(wp.fm(2.5e6), '$2.50M');
  eq(wp.fm(150e6), '$150.0M');
  eq(wp.fm(1.234e9), '$1.23B');
  eq(wp.fm(-125000), '-$125K');
  eq(wp.fm(500), '$500');
  eq(wp.fmShort(28e6), '$28M');
  eq(wp.fmShort(27.6e6), '$27.6M');
  eq(wp.fm1(1.5e9), '$1.5B');
});
t('tint() mixes a series colour 68% toward the card; junk passes through', () => {
  const card = wp.cssVar('--surface');
  ok(/^#[0-9a-f]{6}$/i.test(card), 'the card colour resolved from theme.css');
  const a = parseInt('7F77DD', 16), b = parseInt(card.slice(1), 16);
  const mix = sh => Math.round((a >> sh & 255) + ((b >> sh & 255) - (a >> sh & 255)) * 0.68);
  eq(wp.tint('#7F77DD'), 'rgb(' + mix(16) + ',' + mix(8) + ',' + mix(0) + ')');
  eq(wp.tint('red'), 'red', 'a non-hex colour is returned untouched');
});

group('take-home slider scale');
t('posToM / mToPos span $0.1M to $500M and round-trip', () => {
  eq(Math.round(wp.posToM(0) * 1e6), 100000, 'the floor is $100K, not $1M');
  eq(Math.round(wp.posToM(1000) * 1e6), 500000000);
  [0.1, 0.5, 5, 20, 500].forEach(m =>
    ok(Math.abs(wp.posToM(wp.mToPos(m)) - m) < 1e-9, m + 'M survives the round-trip'));
});
t('mToPos clamps out-of-range amounts onto the track', () => {
  eq(wp.mToPos(0.01), 0, 'below the floor pins to the low end');
  eq(wp.mToPos(2000), 1000, 'above the ceiling pins to the high end');
});
t('the decades are evenly spaced, so small wins are as draggable as big ones', () => {
  // Each 10x costs the same length of track — that is the whole point of the
  // log scale, and it is what makes a $500K share reachable by dragging.
  const decade = wp.mToPos(10) - wp.mToPos(1);
  ok(Math.abs((wp.mToPos(1) - wp.mToPos(0.1)) - decade) < 1e-9);
  ok(Math.abs((wp.mToPos(100) - wp.mToPos(10)) - decade) < 1e-9);
});

group('syncSlider — the typed-value boundary (portfolio)');
/* Drives the REAL onchange handler on the real boxes, with the same arguments
   the markup passes. Unlike the groups above these tests have side effects:
   syncSlider ends in render(), which rewrites every box and saves slider
   state — into the localhost copy's own storage only, which the gate below
   already guarantees. The first test notes where the sliders were and the
   last one puts them back. */
function syncBox(boxId, typed, args) {
  const el = wp.document.getElementById(boxId);
  el.value = typed;
  wp.syncSlider.apply(null, [el].concat(args));
}
const TOT_ARGS   = ['sl-tot', 0.1, 500, 1e6, true];
const SP_ARGS    = ['sl-sp', 50, 5000, 1e3];
const SPLIT_ARGS = ['sl-split', 40, 80];
const slider = (id) => wp.document.getElementById(id).value;
let _slBefore = null;
t('a typed K/M/B suffix is an absolute amount, converted to the slider\'s unit', () => {
  _slBefore = { tot: slider('sl-tot'), sp: slider('sl-sp'), split: slider('sl-split') };
  syncBox('o-tot', '0.2B', TOT_ARGS);
  near(wp.posToM(parseFloat(slider('sl-tot'))), 200, '"0.2B" is 200 slider-millions');
  syncBox('o-sp', '1.5M', SP_ARGS);
  eq(parseFloat(slider('sl-sp')), 1500, '"1.5M" of spending is 1500 slider-thousands');
});
t('"5B" clamps to the $500M ceiling instead of quietly reading as $5M', () => {
  // The documented past bug: the suffix was stripped, so "5B" set $5M.
  syncBox('o-tot', '5B', TOT_ARGS);
  near(wp.posToM(parseFloat(slider('sl-tot'))), 500);
});
t('the split box reads the left half of "NN/MM"', () => {
  syncBox('o-split', '55/45', SPLIT_ARGS);
  eq(parseFloat(slider('sl-split')), 55);
});
t('dollar signs and commas are stripped; out-of-range values clamp onto the track', () => {
  syncBox('o-sp', '$9,999', SP_ARGS);
  eq(parseFloat(slider('sl-sp')), 5000);
  syncBox('o-sp', '3', SP_ARGS);
  eq(parseFloat(slider('sl-sp')), 50, 'below the floor pins to the low end');
});
t('junk leaves the slider alone and the box snaps back to the real value', () => {
  const before = slider('sl-sp');
  syncBox('o-sp', 'abc', SP_ARGS);
  eq(slider('sl-sp'), before, 'the slider must not move');
  eq(wp.document.getElementById('o-sp').value, wp.fm(parseFloat(before) * 1e3),
     'the box shows the value actually in use, not the junk');
  // Put the sliders back where the page had them before this group ran.
  wp.document.getElementById('sl-tot').value = _slBefore.tot;
  wp.document.getElementById('sl-sp').value = _slBefore.sp;
  wp.document.getElementById('sl-split').value = _slBefore.split;
  wp.render();
});

/* ── Runner ───────────────────────────────────────────────────────────────── */
/* ── The localhost gate ─────────────────────────────────────────────────────
   Booting the pages is itself the side effect worth guarding: they save their
   defaults and their jackpot caches the moment they load, and on the published
   site that is a visitor's own stored settings, on the origin every app in this
   family shares. So the frames are created only on a local server, and the
   check comes before they exist rather than inside their load handler.

   file:// is NOT in this list, deliberately: it has no hostname, and treating
   it as local would build frames a browser then blocks, leaving the page to
   blame the code for what is a setup problem. Same rule as the sibling apps.
─────────────────────────────────────────────────────────────────────────── */
/* ── Offline: the service worker ────────────────────────────────────────────
   Read as TEXT rather than exercised as a live worker, and that is the point
   rather than a shortcut: registration is frame-guarded, so this suite never
   installs one — a suite that did would be testing whatever that worker had
   cached instead of the files on disk.

   What is worth asserting is the SHAPE of the thing. Cache Storage is keyed by
   ORIGIN and shared with every sibling app, so "only files already public in
   this repo, ever" is the promise holding this up. */
let SW_SRC = '', KILL_SRC = '', INDEX_SRC = '', CALC_SRC = '', PORT_SRC = '';
const stripComments = (src) => src.replace(/\/\*[\s\S]*?\*\//g, '').replace(/^\s*\/\/.*$/gm, '');

group('Offline — the service worker');

t('sw.js and its kill switch are both present', () => {
  ok(SW_SRC, 'sw.js is missing');
  ok(KILL_SRC, 'sw-kill.js is missing — the escape hatch has to exist BEFORE it is needed');
});

t('the cache list holds only files that are already public', () => {
  const m = SW_SRC.match(/const SHELL = \[([\s\S]*?)\]/);
  ok(m, 'could not find the SHELL list in sw.js');
  const shell = [...m[1].matchAll(/'([^']+)'/g)].map((x) => x[1]).sort();
  /* Exact equality, not "contains". A new entry has to be added here too, which
     is the moment to ask whether the file is genuinely public. */
  eq(shell, ['./', 'favicon.ico', 'lottery-portfolio.html', 'ny-lottery-calculator.html',
             'privacy.html', 'theme.css'], 'the offline shell list changed');
});

t('no live figure is ever cached — a stale jackpot is a wrong answer', () => {
  const m = SW_SRC.match(/const SHELL = \[([\s\S]*?)\]/);
  const shell = [...m[1].matchAll(/'([^']+)'/g)].map((x) => x[1]);
  for (const entry of shell)
    for (const pat of [/^tests\.html$/, /\.py$/, /worker\.js$/, /CLAUDE/i, /README/i])
      ok(!pat.test(entry), `"${entry}" is on the shell list but must never be cached`);
  /* The three feeds are cross-origin, so the worker never sees them at all —
     pinned here because caching one would be a correctness bug, not just a
     privacy one: the page would show last week's jackpot as this week's. */
  const code = stripComments(SW_SRC);
  ok(/url\.origin !== self\.location\.origin\) return;/.test(code),
    'the fetch handler must ignore every cross-origin request outright');
  for (const host of ['workers.dev', 'data.ny.gov', 'treasury'])
    ok(!code.includes(host), `sw.js names ${host} in executable code`);
});

t('the worker touches nothing cross-origin, and has no eval', () => {
  const code = stripComments(SW_SRC);
  ok(!/https?:\/\//.test(code), 'sw.js names an off-origin URL in executable code');
  /* A worker on Pages runs with NO CSP at all, so these are not merely untidy. */
  for (const bad of ['eval(', 'importScripts(', 'new Function('])
    ok(!code.includes(bad), `sw.js uses ${bad} — it runs with no CSP, so it must not`);
});

t('the worker deletes only its own caches', () => {
  const code = stripComments(SW_SRC);
  ok(/startsWith\(PREFIX\)/.test(code), 'activate must guard caches.delete with the prefix');
  ok(/const PREFIX = 'lot-shell-';/.test(SW_SRC), 'and the prefix must be this repo’s');
});

t('the worker is network-first, so cached code needs a failed network', () => {
  const code = stripComments(SW_SRC);
  ok(/Promise\.race/.test(code) && /cache\.match/.test(code), 'expected the network-first race');
  ok(!/caches\.match\(req\)\s*\.then\(\s*\(?r\)?\s*=>\s*r\s*\|\|/.test(code),
    'this looks cache-first — the whole design rests on network-first');
  ok(/!res\.ok && cached/.test(code),
    'a same-origin error reply with a cached copy in hand must serve the cache');
});

t('a missing shell file can be repaired without a new worker version', () => {
  const code = stripComments(SW_SRC);
  ok(/addEventListener\(\s*'message'/.test(code) && /'shell-check'/.test(code),
    'the worker must accept a shell-check message');
  ok(!/addAll/.test(code), 'addAll rejects the whole precache on a single 404, silently');
  ok(/e\.data\.type !== 'shell-check'\) return;/.test(code),
    'the message handler must reject anything but shell-check');
  ok(!/e\.data\.(url|urls|path|cache|key)/.test(code),
    'and must never read a URL or cache name out of a message');
});

t('the kill switch stays a pure uninstaller', () => {
  const code = stripComments(KILL_SRC);
  ok(/unregister\(\)/.test(code), 'sw-kill.js must unregister itself');
  ok(!/addEventListener\(\s*'fetch'/.test(code), 'and intercept nothing — inert is the point');
  ok(!/cache\.put|addAll/.test(code), 'and never cache anything');
  ok(/startsWith\('lot-shell-'\)/.test(code), 'and clear only this repo’s caches');
});

t('all three pages register the worker, frame-guarded, after load', () => {
  /* Whichever page you open first installs it, and all three are in its scope —
     so someone who bookmarked the calculator gets offline too. The frame guard
     is what stops this very suite installing one while it runs. */
  for (const [name, src] of [['index.html', INDEX_SRC], ['the calculator', CALC_SRC],
                             ['the portfolio', PORT_SRC]]) {
    ok(/navigator\.serviceWorker\.register\('sw\.js', \{ scope: '\.\/' \}\)/.test(src),
      `${name} must register the worker`);
    ok(/window\.top !== window\.self/.test(src),
      `${name}'s registration must skip frames, or this suite would install one`);
    ok(/window\.addEventListener\('load', function \(\) \{/.test(src),
      `${name} must wait for load rather than compete with first paint`);
    ok(/if \(reg\.active\) reg\.active\.postMessage\(\{ type: 'shell-check' \}\)/.test(src),
      `${name} must ask for a shell check on load`);
    const csp = (src.match(/http-equiv="Content-Security-Policy" content="([^"]+)"/) || [])[1] || '';
    ok(/worker-src 'self'/.test(csp),
      `${name}'s CSP must spell out worker-src 'self', not lean on the fallback chain`);
    ok(!/worker-src[^;]*https?:/.test(csp), `${name}'s worker-src must admit no off-origin host`);
  }
});

t('no schema halt here, and that is the deliberate difference', () => {
  /* The sibling apps refuse to open a saved copy from a newer build, because
     stale code there strips fields out of somebody's records and pushes the
     loss to their other devices. These pages save no records — only
     preferences and caches of public feeds — so there is nothing to lose and
     nothing to halt over. If that ever changes, this test is the tripwire. */
  for (const [name, src] of [['the calculator', CALC_SRC], ['the portfolio', PORT_SRC]])
    ok(!/haltForNewerData/.test(src), `${name} has grown a halt — has it started saving records?`);
  const stored = [...(CALC_SRC + PORT_SRC).matchAll(/localStorage\.setItem\('([^']+)'/g)]
    .map((m) => m[1]).filter((v, i, a) => a.indexOf(v) === i).sort();
  eq(stored, ['lottery-details', 'lottery-game', 'lottery-jackpot-cache', 'lottery-net-takehome',
              'lottery-npeople', 'lottery-portfolio-sections', 'lottery-portfolio-seeded-from',
              'lottery-portfolio-sliders', 'lottery-tbill-adopted', 'lottery-tbill-cache',
              'lottery-theme', 'lottery-winning', 'lottery-winning-cache'],
     'the stored keys changed — every one must still be a preference or a cache, or this repo needs a version marker like its siblings');
});

/* ── The index page ─────────────────────────────────────────────────────────
   It exists because without it GitHub Pages served a Jekyll rendering of
   README.md at /lottery/ — a page on the shared origin with no CSP that pulled
   a script from cdnjs. These two tests are what stop that coming back. */
group('index.html — the page /lottery/ actually serves');

t('it ships a CSP and loads no third-party script', () => {
  ok(INDEX_SRC, 'index.html is missing — Pages will fall back to rendering the README');
  ok(/http-equiv="Content-Security-Policy"/.test(INDEX_SRC), 'index.html must carry a CSP');
  ok(!/<script[^>]+src=/i.test(INDEX_SRC), 'index.html must load no external script');
  /* Attributes only, not prose: the file's own comment names the cdnjs script
     that used to be served here, which is the whole reason it exists. */
  const urls = [...INDEX_SRC.matchAll(/(?:src|href)="([^"]+)"/g)].map((m) => m[1]);
  for (const u of urls)
    ok(!/cdnjs|unpkg|jsdelivr|cloudflare\.com\/ajax/i.test(u),
      `index.html points at a CDN: ${u}`);
});

t('it links both tools, the privacy policy and How it works', () => {
  for (const href of ['ny-lottery-calculator.html', 'lottery-portfolio.html', 'privacy.html'])
    ok(INDEX_SRC.includes('href="' + href + '"'), `index.html must link ${href}`);
  ok(/>How it works</.test(INDEX_SRC), 'the footer link is labelled "How it works" family-wide');
  ok(/MIT licensed/.test(INDEX_SRC), 'and carries the authorship line every public page has');
});

const LOCAL_HOSTS = ['localhost', '127.0.0.1', '[::1]'];

/* The offline group reads files rather than frames, so it is fetched here and
   handed to run() — the test bodies themselves stay synchronous, like every
   other one on this page. A missing file leaves its variable empty and fails
   its own test rather than taking the suite down. */
async function loadSources() {
  const grab = async (f) => { try { const r = await fetch(f); return r.ok ? await r.text() : ''; } catch (e) { return ''; } };
  [SW_SRC, KILL_SRC, INDEX_SRC, CALC_SRC, PORT_SRC] = await Promise.all(
    [grab('sw.js'), grab('sw-kill.js'), grab('index.html'),
     grab('ny-lottery-calculator.html'), grab('lottery-portfolio.html')]);
}

window.addEventListener('load', () => {
  if (!LOCAL_HOSTS.includes(location.hostname)) return refuse();
  const frame = (id, src, title) => {
    const f = document.createElement('iframe');
    f.id = id; f.src = src; f.title = title;
    /* Both apps' frame-busters break out of any framer that does NOT carry
       this attribute — it is what marks these frames as the one legitimate,
       same-origin exception. */
    f.setAttribute('data-lottery-tests', '');
    f.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none';
    document.body.appendChild(f);
    return f;
  };
  const calc = frame('calc', 'ny-lottery-calculator.html', 'calculator under test');
  const port = frame('port', 'lottery-portfolio.html', 'portfolio under test');
  /* Both pages are classic scripts at the foot of the body, so their function
     declarations exist by each frame's load event; poll for both frames. */
  const ready = () => calc.contentWindow.parseField && port.contentWindow.computeIncome;
  /* Bounded, because the un-bounded version polled for ever: opened off disk
     (file:// frames are blocked) or with nothing serving the folder, the frames
     never become ready and the page just sat there saying "Loading" with no
     hint that the setup, not the code, was the problem. Five seconds is far
     longer than two local frames need. */
  const giveUpAt = Date.now() + 5000;
  const tick = () => {
    if (ready()) return loadSources().then(run);
    if (Date.now() < giveUpAt) return setTimeout(tick, 100);
    const s = document.getElementById('summary');
    s.className = 'bad';
    s.textContent = 'The hidden frames never loaded the pages — is this folder being served?';
    document.getElementById('out').innerHTML =
      '<tr><td class="msg" style="white-space:normal;font-family:inherit;font-size:13px">' +
      'This page tests the real calculator and portfolio in hidden frames, and a browser ' +
      'blocks those when it is opened straight off disk. Run <code>cd ~/claude-lottery ' +
      '&amp;&amp; python3 -m http.server 8010</code> and open ' +
      '<code>http://localhost:8010/tests.html</code>.</td></tr>';
  };
  setTimeout(tick, 150);
});

/* Two reasons to land here, needing different sentences: the published site
   (where booting the pages would write into a visitor's own saved settings) and
   a file:// copy off disk (where it cannot work at all — browsers block file://
   frames). Both end at the same instruction. */
function refuse() {
  const onDisk = location.protocol === 'file:';
  const s = document.getElementById('summary');
  s.className = 'bad';
  s.textContent = onDisk
    ? 'Not run from a file — this page needs a local server.'
    : 'Not run here — this page boots live copies of the pages it tests.';
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = 3;
  td.style.cssText = 'font-size:13px;line-height:1.6';
  td.innerHTML = (onDisk
    ? 'The suite loads the calculator and the portfolio in hidden frames to test them, and a '
      + 'browser blocks those frames when the page is opened straight off disk — so the tests '
      + 'would have nothing to run against. Serve the folder instead:'
    : 'The suite loads the calculator and the portfolio in hidden frames to test them. On '
      + '<strong></strong> those pages would save their defaults into your own browser storage. '
      + 'It runs on <code>localhost</code> only, against a copy served from the repo folder:') +
    '<br><br><code>cd ~/claude-lottery &amp;&amp; python3 -m http.server 8010</code><br>' +
    'then open <code>http://localhost:8010/tests.html</code>.<br><br>' +
    'Nothing has been changed by opening this page — ' +
    '<a href="ny-lottery-calculator.html">back to the calculator</a>.';
  if (!onDisk) td.querySelector('strong').textContent = location.hostname;
  tr.appendChild(td);
  document.getElementById('out').appendChild(tr);
  showLatestRun();
}


/* ── The scorecard, where the suite itself can't run ─────────────────────────
   Refusing to run and then saying nothing about whether the tests pass is half
   an answer: the question someone opens this page to ask is "is it green?".
   The same suite runs headless in CI on every push, so ask GitHub how that went
   and show it here. Nothing is booted and nothing is stored — it is one public,
   unauthenticated read of a workflow's run list.
─────────────────────────────────────────────────────────────────────────── */
function showLatestRun() {
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = 3;
  td.style.cssText = 'font-size:14px;line-height:1.6;padding:12px 16px';
  td.textContent = 'Checking the latest CI run…';
  tr.appendChild(td);
  document.getElementById('out').appendChild(tr);

  fetch('https://api.github.com/repos/eagleadams86/lottery/actions/workflows/tests.yml/runs?branch=main&per_page=1')
    .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
    .then((d) => {
      const run = d && d.workflow_runs && d.workflow_runs[0];
      if (!run) { td.textContent = 'No CI runs found for this repository yet.'; return; }
      const done = run.status === 'completed';
      const okRun = run.conclusion === 'success';
      tr.className = !done ? '' : (okRun ? 'pass' : 'fail');
      const when = run.updated_at ? new Date(run.updated_at).toLocaleString() : '';
      const sha = String(run.head_sha || '').slice(0, 7);
      /* Only ever build an <a> when the API really did hand back a GitHub https
         URL — the same guard the app uses for any URL out of an API. */
      const url = String(run.html_url || '');
      td.textContent = (!done ? '⏳ The latest run is still going'
        : okRun ? '✓ The full suite passed in CI' : '✕ The suite FAILED in CI')
        + (when ? ' — ' + when : '') + (sha ? ' · commit ' + sha : '') + '. ';
      if (/^https:\/\/github\.com\//.test(url)) {
        const a = document.createElement('a');
        a.href = url; a.rel = 'noopener noreferrer';
        a.textContent = 'Open the run for the full scorecard';
        td.appendChild(a);
      }
    })
    .catch(() => { td.textContent = 'Could not reach GitHub to check the latest CI run.'; });
}

function run() {
  wc = document.getElementById('calc').contentWindow;
  wp = document.getElementById('port').contentWindow;
  const out = document.getElementById('out');
  let pass = 0, fail = 0;
  for (const item of TESTS) {
    if (item.group) {
      const tr = document.createElement('tr');
      tr.className = 'group';
      tr.innerHTML = '<td colspan="3"></td>';
      tr.firstChild.textContent = item.group;
      out.appendChild(tr);
      continue;
    }
    const tr = document.createElement('tr');
    const st = document.createElement('td'); st.className = 'st';
    const name = document.createElement('td'); name.textContent = item.name;
    const msg = document.createElement('td'); msg.className = 'msg';
    try {
      item.fn();
      tr.className = 'pass'; st.textContent = '✓'; pass++;
    } catch (e) {
      tr.className = 'fail'; st.textContent = '✕'; msg.textContent = e.message; fail++;
    }
    tr.appendChild(st); tr.appendChild(name); tr.appendChild(msg);
    out.appendChild(tr);
  }
  const s = document.getElementById('summary');
  s.textContent = fail === 0 ? `All ${pass} tests pass` : `${fail} of ${pass + fail} tests FAILED`;
  s.className = fail === 0 ? 'ok' : 'bad';
  document.title = (fail === 0 ? '✓ ' : '✕ ') + document.title;
}
</script>
